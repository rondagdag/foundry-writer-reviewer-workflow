# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-workflow-2
services:
  agent-workflow-prj:
    host: azure.ai.project
    endpoint: https://ron-agent-workflow-foundry.services.ai.azure.com/api/projects/agent-workflow-prj
  foundry-workflow-2:
    project: .
    host: azure.ai.agent
    language: python
    uses:
      - agent-workflow-prj
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: app.py
      runtime: python_3_14
    container:
      resources:
        cpu: "0.5"
        memory: 1.0Gi
    kind: hosted
    name: foundry-workflow-2
    protocols:
      - protocol: responses
        version: 2.0.0
infra:
  provider: microsoft.foundry
